[project]
name = "cabcontrol-tools"
version = "1.0.0"
description = "CabControl Bluetooth firmware flasher and diagnostics TUI (macOS)"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
    "textual>=0.80",
]

[project.scripts]
ble-flash = "ble_flash:main"
cab-tui = "cab_tui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["ble_flash.py", "cab_tui.py"]
